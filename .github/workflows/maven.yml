name: Java CI with Maven & Auto-Release

on:
  push:
  pull_request:
  pull_request_target:
    types: [closed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    if: github.event_name != 'pull_request_target'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
    - name: Build with Maven
      run: mvn package
    - name: Upload a Build Artifact
      uses: actions/upload-artifact@v7
      with:
        archive: false
        path: |
          target/*.jar
          !target/original-*.jar

  dependabot-release:
    if: |
      github.event_name == 'pull_request_target' &&
      github.event.pull_request.merged == true &&
      github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
    
    - name: Set up JDK
      uses: actions/setup-java@v5
      with:
        java-version: '25'
        distribution: 'temurin'
        
    - name: Build Release Jar
      run: mvn package

    - name: Get current date for Versioning
      id: date
      run: echo "date=$(date +'%Y.%m.%d-%H%M')" >> $GITHUB_OUTPUT

    - name: Create Release and Upload Artifact
      uses: softprops/action-gh-release@v2
      with:
        tag_name: dep-update-${{ steps.date.outputs.date }}
        name: "Dependency Update (${{ steps.date.outputs.date }})"
        body: |
          Automated build triggered by Dependabot update.
          Merged PR: #${{ github.event.pull_request.number }} - ${{ github.event.pull_request.title }}
        files: |
          target/*.jar
          !target/original-*.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        
